services:
  game:
    build: .
    restart: unless-stopped
    environment:
      - ADMIN_TOKEN=${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}
    expose:
      - "8000"

  # HTTPS + WebSockets in front of the game, certificates are automatic (Let's Encrypt).
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - game

volumes:
  caddy_data:
